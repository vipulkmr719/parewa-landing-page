<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Parewa">
  <title>Parewa</title>
  <!-- Single-colour mark. Inherits currentColor, so it works on any ground;
       the folds read as opacity steps rather than as separate inks. -->
  <g fill="currentColor">
    <polygon points="26,13 8,2 18,26"                 opacity="1"/>
    <polygon points="45,14 38,8 32,12 30,18 39,17"    opacity=".92"/>
    <polygon points="18,26 12,38 5,46 24,33"          opacity=".86"/>
    <polygon points="30,18 26,13 18,26 24,33 35,22 39,17" opacity=".78"/>
    <polygon points="18,26 2,35 12,38"                opacity=".62"/>
  </g>
</svg>
